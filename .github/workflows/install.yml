name: Install
on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment'
        required: true
        type: environment
        default: 'beta'
      ref:
        description: 'Branch/tag/SHA of digitraffic-rail-history-private'
        required: true
        default: 'master'
      diff-only:
        description: "Only run diff"
        required: true
        type: boolean
        default: false
      config-repo-branch:
        description: 'Config repo branch'
        default: master
        required: true
        type: string
jobs:
  install:
    if: github.repository != 'tmfg/digitraffic-rail-history'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      actions: read
    environment: ${{ github.event.inputs.env }}
    steps:
      - name: Log workflow inputs and environment
        run: |
          echo "## Workflow Inputs" >> $GITHUB_STEP_SUMMARY
          echo "| Name | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| actor | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| env | ${{ github.event.inputs.env }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ref | ${{ github.event.inputs.ref }} |" >> $GITHUB_STEP_SUMMARY
          echo "| diff-only | ${{ github.event.inputs.diff-only }} |" >> $GITHUB_STEP_SUMMARY
          echo "| config-repo-branch | ${{ github.event.inputs.config-repo-branch }} |" >> $GITHUB_STEP_SUMMARY
          # echo "| db-install | ${{ github.event.inputs.db-install }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        shell: bash
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref }}
      - name: Checkout CI-repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.CONFIG_REPO_NAME }}
          ssh-key: ${{ secrets.CONFIG_SSH_PRIVATE_KEY }}
          ref: ${{ inputs.config-repo-branch }}
          path: digitraffic-ci
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: corretto
          cache: maven
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: "pnpm"
          cache-dependency-path: ./train-history-backend
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: gh-actions-build-rail-history-${{ github.event.inputs.env }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Run initialize
        run: mvn initialize
      - name: Build backend
        run: |
          cd train-history-backend
          mvn install -DskipTests=true -Ddependency-check.skip=true
          pnpm install
          pnpm build
          cp target/train-history-backend-0.0.1-SNAPSHOT.jar ../digitraffic-ci/aws/train-history-backend.jar
          cd ../digitraffic-ci/aws
          
          docker buildx build \
            --no-cache \
            --build-arg ENV=${{ github.event.inputs.env }} \
            --build-arg APP_FILE=train-history-backend.jar \
            --build-arg PROPERTY_FILE=conf/rail/train-history-backend-${{ github.event.inputs.env }}.properties \
            --platform linux/arm64 \
            --output type=docker \
            --tag ${{ secrets.ECR_URL }}/dt-rail-train-history-backend-repository:${{ github.sha }}-${{ github.run_id }} \
            --pull=true \
            --file=docker/Dockerfile-rail-train-history-backend .
          
          docker push ${{ secrets.ECR_URL }}/dt-rail-train-history-backend-repository:${{ github.sha }}-${{ github.run_id }}
      - name: Put backend tag in Parameter Store
        run: |
          aws ssm put-parameter \
            --name "/rail/train-history-backend/image-tag" \
            --value "${{ github.sha }}-${{ github.run_id }}" \
            --type "String" \
            --overwrite
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
      - name: Build updater
        run: |
          cd train-history-updater
          mvn install -DskipTests=true -Ddependency-check.skip=true
          cp target/train-history-updater-0.0.1-SNAPSHOT.jar ../digitraffic-ci/aws/train-history-updater.jar
          cd ../digitraffic-ci/aws
          docker buildx build \
            --no-cache \
            --build-arg ENV=${{ github.event.inputs.env }} \
            --build-arg APP_FILE=train-history-updater.jar \
            --build-arg PROPERTY_FILE=conf/rail/train-history-updater-${{ github.event.inputs.env }}.properties \
            --platform linux/arm64 \
            --output type=docker \
            --tag ${{ secrets.ECR_URL }}/dt-rail-train-history-updater-repository:${{ github.sha }}-${{ github.run_id }} \
            --pull=true \
            --file=docker/Dockerfile-rail-train-history-updater .
          
          docker push ${{ secrets.ECR_URL }}/dt-rail-train-history-updater-repository:${{ github.sha }}-${{ github.run_id }}
      - name: Put updater tag in Parameter Store
        run: |
          aws ssm put-parameter \
            --name "/rail/train-history-updater/image-tag" \
            --value "${{ github.sha }}-${{ github.run_id }}" \
            --type "String" \
            --overwrite
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Generate backend SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          SYFT_FILE_METADATA_SELECTION: "none"
        with:
          image: ${{ secrets.ECR_URL }}/dt-rail-train-history-backend-repository:${{ github.sha }}-${{ github.run_id }}
          format: cyclonedx-json
          output-file: history-backend-sbom.json

      - name: Generate updater SBOM
        run: |
          cd train-history-updater
          mvn -DoutputName=history-updater-sbom cyclonedx:makeBom
      - name: Upload backend SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: history-backend-sbom.json
          path: history-backend-sbom.json
      - name: Upload updater SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: history-updater-sbom.json
          path: train-history-updater/target/history-updater-sbom.json

  deploy:
    if: ${{ always() && github.repository != 'tmfg/digitraffic-rail-history' && contains(needs.*.result, 'success') && !(contains(needs.*.result, 'failure')) }}
    environment: ${{ github.event.inputs.env }}
    needs: install
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout CI-repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.CONFIG_REPO_NAME }}
          ssh-key: ${{ secrets.CONFIG_SSH_PRIVATE_KEY }}
          ref: ${{ inputs.config-repo-branch }}
          path: digitraffic-ci
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: gh-actions-install-rail-${{ github.event.inputs.env }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Build CI/CDK Infra project
        working-directory: digitraffic-ci/aws/cdk/infra
        run: |
          pnpm install
          pnpm build:ci

      - name: Diff and deploy
        env:
          DEPLOY_ALL_CHANGES: true
          DIFF_ONLY: ${{ github.event.inputs['diff-only'] }}
          # the value of AWS_PROFILE is only used by the stack code, local AWS profile configurations are not being set up
          AWS_PROFILE: ${{ secrets.AWS_PROFILE }}
          STACK_NAME: TrainHistory${{ github.event.inputs['env'] == 'prod' && 'Prod' || 'Test' }}
        working-directory: digitraffic-ci/aws/cdk/infra/scripts
        run: |
          pnpm install
          pnpm build
          pnpm run start:diff-and-deploy $STACK_NAME      

      - name: Download backend SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: history-backend-sbom.json

      - name: Download updater SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: history-updater-sbom.json

      - name: Read SBOM config
        id: sbom-config
        run: |
          echo "config<<EOF" >> $GITHUB_OUTPUT
          cat digitraffic-ci/aws/sbom/rail.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "common<<EOF" >> $GITHUB_OUTPUT
          cat digitraffic-ci/aws/sbom/config.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT                  

      - name: Configure AWS credentials for SBOM install
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ fromJson(steps.sbom-config.outputs.common).sbomUploadRoleArn }}
          role-session-name: gh-actions-upload-sbom-rail-${{ github.event.inputs.env }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload SBOM files
        run: |
          aws s3 cp history-backend-sbom.json s3://${{ fromJson(steps.sbom-config.outputs.common).bucketArn }}/${{ fromJson(steps.sbom-config.outputs.config)[github.event.inputs.env]['history-backend'] }}/${{ github.run_id }}-${{ github.sha }}.json
          aws s3 cp history-updater-sbom.json s3://${{ fromJson(steps.sbom-config.outputs.common).bucketArn }}/${{ fromJson(steps.sbom-config.outputs.config)[github.event.inputs.env]['history-updater'] }}/${{ github.run_id }}-${{ github.sha }}.json

  E2E:
    if: ${{ github.repository != 'tmfg/digitraffic-rail-history' && github.event.inputs.env == 'beta' && always() && contains(needs.*.result, 'success') && !(contains(needs.*.result, 'failure')) }}
    needs: deploy
    environment: ${{ github.event.inputs.env }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.commit-hash }}
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: "pnpm"
          cache-dependency-path: ./train-history-backend

      - name: Remove .env.playwright (CI uses env vars)
        run: rm -f .env.playwright
        working-directory: ./train-history-backend

      - name: Install dependencies for E2E-tests
        working-directory: ./train-history-backend
        run: pnpm install

      - name: Install Playwright Browsers
        working-directory: ./train-history-backend
        run: pnpm dlx playwright install --with-deps

      - name: Update Playwright
        working-directory: ./train-history-backend
        run: pnpm exec playwright install

      - name: Run E2E-tests
        env:
          TRAIN_HISTORY_TEST_URL: ${{ vars.TRAIN_HISTORY_TEST_URL }}
        working-directory: ./train-history-backend
        run: pnpm run e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: ./train-history-backend/playwright-report/
          retention-days: 30
