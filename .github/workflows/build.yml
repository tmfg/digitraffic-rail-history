name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    if: github.repository != 'tmfg/digitraffic-rail-history'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: corretto
          cache: maven
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - name: Run initialize
        run: mvn initialize
      - name: Build backend
        run: |
          cd train-history-backend
          pnpm install
          pnpm build
          mvn install -DskipTests=true
      - name: Build updater
        run: |
          cd train-history-updater
          mvn install
      - name: Setup database
        run: |
          cd db
          docker compose up -d
      - name: Wait for database readiness
        run: |
          until docker exec db-rail_history_mysql-1 mysqladmin ping -h localhost --silent; do
            echo "Waiting for database to be ready..."
            sleep 5
          done
      - name: Run database migrations
        run: |
          cd db
          docker compose up rail_history_flyway
      - name: Get database IP
        run: echo "db_addr=$(docker inspect db-rail_history_mysql-1 -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}')" >> $GITHUB_ENV
      - name: Run backend tests
        run: |
          cd train-history-backend
          mvn -f pom.xml test -Dspring.datasource.url=jdbc:aws-wrapper:mysql://${{ env.db_addr }}/trainhistoryjson -Dspring.datasource.username=rail_history -Dspring.datasource.password=rail_pass123

