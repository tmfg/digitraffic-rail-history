name: "CodeQL"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '22 20 * * 0'

jobs:
  analyze:
    if: github.repository == 'tmfg/digitraffic-rail-history'
    name: Analyze
    runs-on: ubuntu-26.04

    permissions:
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java', 'javascript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Java
      if: ${{ matrix.language=='java' }}
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: 25
        distribution: corretto
        cache: maven

    - name: Initialize CodeQL
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        languages: ${{ matrix.language }}

    - name: Build backend
      if: ${{ matrix.language=='java' }}
      run: |
        cd train-history-backend
        mvn clean package -e -U -B

    - name: Build updater
      if: ${{ matrix.language=='java' }}
      run: |
        cd train-history-updater
        mvn clean package -e -U -B

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        category: "/language:${{matrix.language}}"
