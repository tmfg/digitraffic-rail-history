name: 'Mirror repo to public'
on:
  push:
    branches:
      - master
jobs:
  mirror-action:
    if: github.repository != 'tmfg/digitraffic-rail-history'
    runs-on: ubuntu-26.04
    steps:
      - name: mirror
        uses: tmfg/digitraffic-actions@c100fbb0b5e8bf90d32b799e298f142dc3afa68e # mirror/v3
        with:
          mirror-repo: git@github.com:tmfg/digitraffic-rail-history
          ssh-private-key: ${{ secrets.MIRROR_SSH_PRIVATE_KEY }}
      - name: Notify Slack
        if: failure()
        uses: tmfg/digitraffic-actions@4cdf78c4e7d654eaa1d8a6677bb7ea00d1bf1ca9 # slack-notify/v1
        with:
          status: failure
          text: FAILED Rail-history Mirror
          fields: repo, job, took
          webhook-url: ${{ secrets.SLACK_ALARMS_WEBHOOK_URL }}
